name: Publish Explorer Docker Image

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Docker image tags, comma-separated (e.g. testnet,devnet)"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/logos-blockchain-explorer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          # One "registry/image:tag" line per comma-separated tag, for build-push-action.
          {
            echo "list<<EOF"
            for tag in $(echo "$TAGS" | tr ',' ' '); do
              if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                echo "::error::Invalid Docker tag: $tag" >&2
                exit 1
              fi
              echo "$REGISTRY/$IMAGE_NAME:$tag"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGES: ${{ steps.tags.outputs.list }}
        run: |
          echo "Image published to:"
          echo "$IMAGES"
