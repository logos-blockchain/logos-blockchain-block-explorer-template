<!doctype html>
<html lang="en">
    <head>
        <title>λ Blockchain Block Explorer</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Lightweight λ Blockchain block Explorer UI" />
        <base href="__BASE_PATH__" />

        <!-- Styles -->
        <link rel="stylesheet" href="static/styles.css" />

        <!-- Preact is vendored (static/vendor/preact); the import map must precede any modulepreload -->
        <script type="importmap">
            {
                "imports": {
                    "preact": "./static/vendor/preact/preact.module.js",
                    "preact/hooks": "./static/vendor/preact/hooks.module.js"
                }
            }
        </script>
        <link rel="modulepreload" href="static/vendor/preact/preact.module.js" />
        <link rel="modulepreload" href="static/vendor/preact/hooks.module.js" />
        <link rel="modulepreload" href="static/app.js" />
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="static/app.js"></script>
    </body>
</html>
